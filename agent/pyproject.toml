[project]
name = "antarctica-agent"
version = "0.1.0"
description = "Google ADK agent for Antarctica: Gemini + the Antarctica MCP tools"
requires-python = ">=3.11"
# Separate from the main package on purpose: google-adk pins an older
# opentelemetry than google-cloud-pubsub allows. See docs/DECISIONS.md (016).
dependencies = [
  "google-adk[mcp]==2.12.0",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["antarctica_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
