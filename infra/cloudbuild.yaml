steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "services/api/Dockerfile", "-t", "${_REPO}/api:${_TAG}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "services/scanner/Dockerfile", "-t", "${_REPO}/scanner:${_TAG}", "."]
images:
  - "${_REPO}/api:${_TAG}"
  - "${_REPO}/scanner:${_TAG}"
