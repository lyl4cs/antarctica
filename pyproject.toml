[project]
name = "antarctica"
version = "0.1.0"
description = "AI web performance auditor on Google Cloud"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "google-cloud-pubsub>=2.23",
]

[project.optional-dependencies]
ai = [
  "google-genai>=1.0",
  "numpy>=1.26",
]
mcp = [
  "mcp>=2.3,<3",
]
dev = [
  "mcp>=2.3,<3",
  "pytest>=8",
  "ruff==0.17.0",
  "httpx>=0.27",
]

[project.scripts]
antarctica-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["services*", "core*", "scripts*", "mcp_server*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in defaults is the framework's intended pattern.
extend-ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
