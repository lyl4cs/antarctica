# Local Postgres + pgvector for the integration tests. Not used in production (that's Neon).
#   docker compose up -d
#   export TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/antarctica_test
#   python -m pytest tests/integration -q
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # local-only throwaway password, never used anywhere real
      POSTGRES_DB: antarctica_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
