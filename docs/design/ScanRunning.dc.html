<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Antarctica — Scan in progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FBF8F2}
a{color:#174E78}a:hover{color:#12202B}
.navlink{padding:10px 16px;border-radius:999px;text-decoration:none;color:#3C4A55;font-weight:500;font-size:15px}
.navlink:hover{background:#F1ECE1;color:#12202B}
.pill{transition:transform .15s ease, box-shadow .15s ease}
.pill:hover{transform:translateY(-1px);box-shadow:0 0 0 6px rgba(255,255,255,.9),0 16px 36px rgba(18,32,43,.14),0 1px 2px rgba(18,32,43,.08)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(5px) rotate(-1.2deg)}}
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%,100%{opacity:.25}50%{opacity:.9}}
.ripple{animation:ripple 2.4s ease-in-out infinite}
.ripple2{animation:ripple 2.4s ease-in-out 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,127,185,.45)}100%{box-shadow:0 0 0 12px rgba(47,127,185,0)}}
.pulse{animation:pulse 1.6s ease-out infinite}
.tick{transition:height .25s ease, background-color .25s ease}
@keyframes zz{0%,100%{opacity:.35;transform:translate(0,2px)}50%{opacity:1;transform:translate(3px,-4px)}}
.zz{animation:zz 2.8s ease-in-out infinite;transform-box:fill-box}
</style>
</helmet>
<div style="min-height: 100vh; background: #FBF8F2; color: #12202B; font-family: 'Instrument Sans', system-ui, sans-serif;">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px 72px; box-sizing: border-box;">

</a>

<circle cx="31.2" cy="-34.4" r="1.2" fill="#FFFFFF"></circle>

</g>

<ellipse cx="50" cy="-24" rx="4" ry="2.5" fill="#F6A9A0" opacity="0.85"></ellipse>
<path d="M 33.5 -27 Q 37 -19 40.5 -27 Z" fill="#F2A33A" stroke="#12202B" stroke-width="2" stroke-linejoin="round"></path>
<path d="M -32 -20 L -42 -29 L -40 -20 L -42 -11 Z" fill="#6FB8E3" stroke="#12202B" stroke-width="2.6" stroke-linejoin="round"></path>
<path d="M -32 -20 C -24 -32 2 -32 10 -20 C 2 -8 -24 -8 -32 -20 Z" fill="#6FB8E3" stroke="#12202B" stroke-width="2.6"></path>

<path d="M -10 -47 C 2 -41 6 -25 -2 -13 C -6 -8 -13 -10 -12 -17 C -10 -27 -16 -39 -10 -47 Z" fill="#2B3A47" stroke="#12202B" stroke-width="3" stroke-linejoin="round"></path>

<path d="M 75 -86 h 6 l -6 7 h 6" fill="none" stroke="#2F7FB9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
</g>
</g>
</g>
</g>
</g>
</svg>
<div style="position: absolute; top: 20px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.92); font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; color: #12202B;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"></path></svg>
northwind.shop
</span>
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; background: {{chipBg}}; color: {{chipFg}};">
<span style="width: 8px; height: 8px; border-radius: 999px; background: {{chipFg}};"></span>{{chipLabel}}
</span>
</div>
</div>

<div style="padding: 36px 40px 40px; display: flex; flex-direction: column; gap: 32px;">
<div style="display: flex; flex-direction: column; gap: 10px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 4vw, 44px); line-height: 1.05; letter-spacing: -0.03em;">{{title}}</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: #3C4A55; max-width: 52ch;">{{sub}}</p>
</div>

<ol aria-label="Scan progress" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<li style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 8px;">
<sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 999px; background: #12202B; color: #FFFFFF; flex: none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></span>
</sc-if>
<sc-if value="{{s.current}}" hint-placeholder-val="{{ false }}">
<span class="pulse" style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 999px; border: 7px solid #2F7FB9; background: #FFFFFF; flex: none;"></span>
</sc-if>
<sc-if value="{{s.todo}}" hint-placeholder-val="{{ false }}">
<span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 999px; border: 2px solid #D6CFC0; background: #FFFFFF; flex: none;"></span>
</sc-if>
<span style="flex: 1; height: 2px; border-radius: 2px; background: {{s.lineColor}};"></span>
</div>
<span style="font-size: 15px; font-weight: 600; color: {{s.labelColor}};">{{s.label}}</span>
</li>
</sc-for>
</ol>

<div style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B6670;">Elapsed</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; color: #12202B;">{{elapsedLabel}}</span>
</div>
<div aria-hidden="true" style="position: relative; height: 56px; display: flex; align-items: flex-end; justify-content: space-between; gap: 2px;">
<span style="position: absolute; left: 50%; right: 0; bottom: 0; height: 56px; border-radius: 10px; background: #F1F7FB;"></span>
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="31">
<span class="tick" style="position: relative; width: 2px; border-radius: 2px; height: {{t.h}}px; background: {{t.c}};"></span>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5B6670;">
<span>0 s</span><span>usually done between 30 and 60 s</span><span>60 s</span>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: #5B6670; padding-top: 4px; border-top: 1px solid #F0EBE1;">
<span style="padding-top: 16px;">Attempt <strong style="color: #12202B; font-weight: 600;">1</strong></span>
<span style="padding-top: 16px;">Created <strong style="color: #12202B; font-weight: 600;">3:24:08 PM</strong></span>
<sc-if value="{{isReady}}" hint-placeholder-val="{{ false }}">
<span style="padding-top: 16px;">Finished <strong style="color: #12202B; font-weight: 600;">3:24:51 PM</strong></span>
</sc-if>
</div>

<sc-if value="{{isReady}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: center; padding: 8px 0 4px;">
<a href="Report.dc.html" class="pill" style="display: inline-flex; align-items: center; gap: 22px; padding: 10px 10px 10px 34px; min-height: 76px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; color: #12202B; text-decoration: none; font-weight: 600; font-size: 21px; border: 1px solid #EFEAE0; box-shadow: 0 0 0 7px rgba(243,240,233,.9), 0 12px 34px rgba(18,32,43,.12), 0 1px 2px rgba(18,32,43,.08);">
<span>Your Report Is Ready</span>
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 999px; background: #2E9A52; color: #FFFFFF;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M6 13l6 6l6-6"></path></svg>
</span>
</a>
</div>
</sc-if>
</div>
</section>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["auto","queued","running","ready"],"default":"auto"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tick: 0 };
  }
  componentDidMount() {
    this.iv = setInterval(() => {
      const t = ((this.state && this.state.tick) || 0) + 1;
      if (t >= 48) clearInterval(this.iv);
      this.setState({ tick: t });
    }, 250);
  }
  componentWillUnmount() {
    clearInterval(this.iv);
  }
  renderVals() {
    const mode = this.props.state ?? 'auto';
    const tick = (this.state && this.state.tick) || 0;
    let phase = mode;
    let elapsed = 0;
    if (mode === 'auto') {
      if (tick < 6) { phase = 'queued'; elapsed = 0; }
      else if (tick < 47) { phase = 'running'; elapsed = tick - 6; }
      else { phase = 'ready'; elapsed = 41; }
    } else if (mode === 'running') {
      elapsed = 24;
    } else if (mode === 'ready') {
      elapsed = 41;
    }

    const copy = {
      queued: { title: 'Waiting for a scanner', sub: 'Your scan is in line and will start in a moment.', chip: 'Queued', bg: '#F1ECE1', fg: '#5B4A2E' },
      running: { title: 'Measuring northwind.shop', sub: 'Loading the page and timing every paint, script and layout shift. This usually takes 30–60 seconds.', chip: 'Running', bg: '#E1EFF9', fg: '#174E78' },
      ready: { title: 'Done. Here’s what we found.', sub: 'Finished in 41 seconds: a score, five core metrics and five findings, each with an AI fix on request.', chip: 'Done', bg: '#DFF2E6', fg: '#1E6B3A' }
    }[phase];

    const order = ['queued', 'running', 'ready'];
    const idx = order.indexOf(phase);
    const labels = ['Queued', 'Running', 'Report ready'];
    const steps = labels.map((label, i) => {
      const done = i < idx || (phase === 'ready' && i === 2);
      const current = i === idx && phase !== 'ready';
      return {
        label,
        done,
        current,
        todo: !done && !current,
        lineColor: i < idx ? '#12202B' : '#E6DFD1',
        labelColor: (done || current) ? '#12202B' : '#8A939A'
      };
    });

    const ticks = [];
    for (let v = 0; v <= 60; v += 2) {
      const passed = v <= elapsed && phase !== 'queued';
      const near = phase === 'running' ? Math.exp(-Math.pow(v - elapsed, 2) / (2 * 16)) : 0;
      const h = Math.round(12 + (passed ? 10 : 0) + 30 * near);
      ticks.push({ h, c: passed ? (near > 0.6 ? '#12202B' : '#2F7FB9') : '#D6CFC0' });
    }

    const mm = Math.floor(elapsed / 60);
    const ss = String(elapsed % 60).padStart(2, '0');

    return {
      title: copy.title,
      sub: copy.sub,
      chipLabel: copy.chip,
      chipBg: copy.bg,
      chipFg: copy.fg,
      steps,
      ticks,
      elapsedLabel: mm + ':' + ss,
      isReady: phase === 'ready',
      eyesSleep: phase === 'queued' ? 1 : 0,
      eyesAwake: phase === 'running' ? 1 : 0,
      eyesHappy: phase === 'ready' ? 1 : 0
    };
  }
}
</script>
</body>
